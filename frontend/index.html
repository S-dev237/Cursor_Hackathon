<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        var t = localStorage.getItem('osh_theme')
        var dark =
          t === 'dark' ||
          (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B1929" />

    <title>OpenScience Hub — Répertoire ouvert des travaux universitaires</title>
    <meta
      name="description"
      content="OpenScience Hub : répertoire institutionnel ouvert des thèses, mémoires et articles académiques universitaires. Recherchez, consultez, citez et partagez la recherche."
    />
    <meta name="author" content="OpenScience Hub" />
    <meta
      name="keywords"
      content="thèses, mémoires, articles académiques, recherche universitaire, répertoire ouvert, open science, citations"
    />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenScience Hub" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="OpenScience Hub — Répertoire ouvert des travaux universitaires"
    />
    <meta
      property="og:description"
      content="Thèses, mémoires et articles académiques, indexés et accessibles. Recherchez, citez et partagez la recherche universitaire."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OpenScience Hub — Répertoire ouvert des travaux universitaires"
    />
    <meta
      name="twitter:description"
      content="Thèses, mémoires et articles académiques, indexés et accessibles."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
